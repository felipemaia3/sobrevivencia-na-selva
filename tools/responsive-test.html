<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste de responsividade</title>
<style>
  body { margin: 0; background: #0b1218; color: #cfe6f5; font: 13px/1.45 "Consolas", monospace; display: flex; }
  #frame { border: 0; background: #000; flex: none; }
  #out { padding: 8px; overflow: auto; flex: 1; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<iframe id="frame" src="../index.html"></iframe>
<pre id="out">carregando…</pre>
<script>
  /* Ferramenta de desenvolvimento: mede o layout do jogo em qualquer viewport.
     Uso: responsive-test.html?w=390&h=720&touch=1&panels=1   (./testar-resposta.js serve a pasta) */
  var Q = new URLSearchParams(location.search);
  var W = +(Q.get('w') || 390), H = +(Q.get('h') || 720);
  var TOUCH = Q.get('touch') !== '0';
  var PANELS = Q.get('panels') !== '0';
  var frame = document.getElementById('frame'), out = document.getElementById('out');
  frame.style.width = W + 'px'; frame.style.height = H + 'px';

  function bounds(o) {
    var b = o.getBounds();
    if (!isFinite(b.width) || b.width === 0) return null;
    return { x: Math.round(b.x), y: Math.round(b.y), r: Math.round(b.right), b: Math.round(b.bottom) };
  }
  function overlap(a, c) {
    return Math.min(a.r, c.r) - Math.max(a.x, c.x) > 1 && Math.min(a.b, c.b) - Math.max(a.y, c.y) > 1;
  }
  function scan(ui, w, h) {
    var over = [];
    (function walk(list, path) {
      list.forEach(function (o) {
        if (o.visible === false) return;
        var b = null; try { b = bounds(o); } catch (e) {}
        var nm = o.type + ':' + path;
        if (b && (b.x < -2 || b.y < -2 || b.r > w + 2 || b.b > h + 2)) over.push(nm + ' [' + b.x + ',' + b.y + ',' + b.r + ',' + b.b + ']');
        if (o.list) walk(o.list, nm);
      });
    })(ui.children.list, 'ui');
    return over;
  }

  function report(data) {
    var txt = JSON.stringify(data, null, 1);
    out.textContent = txt;
    document.title = data.overflow && data.overflow.length ? 'FALHA layout' : (data.conflicts && data.conflicts.length ? 'FALHA sobreposicao' : 'OK ' + W + 'x' + H);
    window.__done = data;
  }

  setTimeout(function () {
    var fw = frame.contentWindow;
    if (!fw.SV || !fw.SV.game) return report({ err: 'o jogo no iframe não iniciou' });
    var st = fw.SV.Game.state || fw.SV.Game.defaultState();
    if (st.settings) st.settings.touch = TOUCH;
    fw.SV.game.scene.getScene('Menu').startGame(st);

    setTimeout(function () {
      var ui = fw.SV.game.scene.getScene('Ui'), gs = fw.SV.game.scene.getScene('Game');
      if (!ui || !gs) return report({ err: 'cenas não criadas' });
      ui.setPrompt('Pressione E para coletar madeira');

      setTimeout(function () {
        var w = fw.SV.game.scale.width, h = fw.SV.game.scale.height;
        var slots = ui.hotbar.map(function (s, i) { return Object.assign({ i: i }, bounds(s.bg)); });
        var btns = (ui.touchBtns || []).map(function (b, i) { return Object.assign({ tag: b.tag || ('btn' + i) }, bounds(b.img)); });
        var joy = bounds(ui.joyBase), hit = bounds(ui.joyHit), conflicts = [];
        if (ui.showTouch) {
          btns.forEach(function (b) { slots.forEach(function (s) { if (overlap(b, s)) conflicts.push(b.tag + ' x slot' + s.i); }); });
          slots.forEach(function (s) { if (overlap(joy, s)) conflicts.push('joystick x slot' + s.i); if (overlap(hit, s)) conflicts.push('areaDoJoystick x slot' + s.i); });
        }
        var res = {
          viewport: W + 'x' + H, tela: Math.round(w) + 'x' + Math.round(h),
          uiScale: +fw.SV.Game.uiScale.toFixed(2), zoom: +gs.cameras.main.zoom.toFixed(2),
          toque: !!ui.showTouch, animais: (gs.animals || []).length,
          hotbar: { esq: slots[0].x, dir: slots[5].r, sup: slots[0].y, inf: slots[0].b },
          joystick: joy, dica: bounds(ui.promptPanel),
          overflow: scan(ui, w, h), conflicts: conflicts, paineis: {}
        };
        if (!PANELS) return report(res);

        var names = ['inv', 'craft', 'pause'];
        (function next(i) {
          if (i >= names.length) return report(res);
          ui.toggle(names[i]);
          setTimeout(function () {
            res.paineis[names[i]] = scan(ui, w, h);
            ui.toggle(names[i]);
            setTimeout(function () { next(i + 1); }, 220);
          }, 320);
        })(0);
      }, 500);
    }, 1600);
  }, 3000);
</script>
</body>
</html>
